<!DOCTYPE html>
<html lang="en">
<head>
    <script src="api-base.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a8c3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="mask-icon" href="icons/icon.svg" color="#4a8c3f">
    <title>KITUI FARM - Sign Up</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #2d5a27;
            margin-bottom: 30px;
        }
        .account-type {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .account-type label {
            flex: 1;
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .account-type input[type="radio"] {
            display: none;
        }
        .account-type input[type="radio"]:checked + label {
            background: #4a8c3f;
            color: white;
            border-color: #4a8c3f;
        }
        .account-type label:hover {
            border-color: #4a8c3f;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #4a8c3f;
        }
        .password-input {
            position: relative;
        }
        .password-input input[type="password"],
        .password-input input[type="text"] {
            padding-right: 45px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 18px;
            line-height: 1;
        }
        .toggle-password:hover {
            color: #4a8c3f;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            background: #e0e0e0;
            transition: all 0.3s;
        }
        .password-strength.weak { background: #ff6b6b; }
        .password-strength.medium { background: #feca57; }
        .password-strength.strong { background: #28a745; }
        .social-icons {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .social-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4a8c3f;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .social-btn:hover {
            background: #3a7a2a;
        }
        .remember-me-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0 20px 0;
        }
        .remember-me-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4a8c3f;
        }
        .remember-me-wrapper label {
            margin: 0;
            font-weight: 400;
            color: #555;
            font-size: 14px;
        }
        .terms-checkbox {
            margin-top: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .terms-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4a8c3f;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #4a8c3f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #3a7a2a;
        }
        .signup-cta {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        .signup-cta a {
            color: #4a8c3f;
            text-decoration: none;
            font-weight: 600;
        }
        .signup-cta a:hover {
            text-decoration: underline;
        }
        .phone-input {
            display: flex;
            align-items: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .phone-input:focus-within { border-color: #4a8c3f; }
        .phone-prefix {
            padding: 12px 0 12px 15px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
        }
        .phone-input input[type="tel"] { border: 0; outline: 0; }
        .phone-input input[type="tel"]:focus { border-color: transparent; }
        .form-options {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 12px 20px;
            margin: 18px 0;
        }
        .form-options .remember-me-wrapper,
        .form-options .terms-checkbox {
            flex: 1 1 190px;
            margin: 0;
        }
        .terms-checkbox label { margin: 0; font-weight: 400; color: #555; }
        .form-status {
            margin-top: 16px;
            color: #2d5a27;
            font-size: 14px;
            text-align: center;
        }
        @media (max-width: 480px) { .container { padding: 28px 22px; } }
    .get-app{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:22px 0 0;padding:16px 18px;border:1px solid #cfe3c6;border-radius:12px;background:#f2f9ee;}
.get-app-icon{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:#e3f0dc;display:grid;place-items:center;overflow:hidden;}
.get-app-icon img{width:38px;height:38px;display:block;}
.get-app-body{flex:1 1 220px;min-width:0;}
.get-app-title{margin:0 0 3px;color:#2d5a27;font-size:15px;font-weight:700;}
.get-app-desc{margin:0;color:#5c6a58;font-size:12px;line-height:1.45;}
.get-app-steps{margin:7px 0 0;color:#5c6a58;font-size:11.5px;line-height:1.55;}
.get-app-steps strong{color:#2d5a27;}
.get-app-actions{flex:0 0 auto;align-self:center;}
.get-app-btn{border:0;border-radius:9px;background:#4a8c3f;color:#fff;font-weight:650;font-size:13px;padding:10px 16px;cursor:pointer;white-space:nowrap;}
.get-app-btn:hover{background:#3a7a2a;}
.get-app-btn:disabled{opacity:.65;cursor:default;}
.get-app-status{flex-basis:100%;margin:0;color:#2d5a27;font-size:12px;}
:root[data-theme="dark"] .get-app{background:#263b27;border-color:#3d5a3b;}
:root[data-theme="dark"] .get-app-icon{background:#2f4a2f;}
:root[data-theme="dark"] .get-app-title{color:#d8e6cf;}
:root[data-theme="dark"] .get-app-desc,:root[data-theme="dark"] .get-app-steps{color:#a6b1a3;}
:root[data-theme="dark"] .get-app-steps strong,:root[data-theme="dark"] .get-app-status{color:#d8e6cf;}
</style>
</head>
<body>
    <main class="container">
        <h1>Create your account</h1>
        <form id="signupForm" novalidate>
            <div class="account-type" role="group" aria-label="Account type">
                <input type="radio" id="account-farmer" name="accountType" value="farmer" checked>
                <label for="account-farmer">Farmer</label>
                <input type="radio" id="account-customer" name="accountType" value="buyer">
                <label for="account-customer">Customer</label>
            </div>
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" autocomplete="name" placeholder="Your full name" required>
                <p class="error-message" id="nameError" aria-live="polite"></p>
            </div>
            <div class="form-group">
                <label for="email">Gmail address</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@gmail.com" required>
                <p class="error-message" id="emailError" aria-live="polite"></p>
            </div>
            <div class="form-group">
                <label for="phone">Kenyan phone number</label>
                <div class="phone-input">
                    <span class="phone-prefix" aria-hidden="true">+254</span>
                    <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel-national"
                        maxlength="20" placeholder="712345678" aria-describedby="phoneError" required>
                </div>
                <p class="error-message" id="phoneError" aria-live="polite"></p>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input">
                    <input type="password" id="password" name="password" autocomplete="new-password"
                        placeholder="Create a password" minlength="8" required>
                    <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
                        <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
                            <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.1-.8"></path>
                        </svg>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength" aria-hidden="true"></div>
                <p class="error-message" id="passwordError" aria-live="polite"></p>
            </div>
            <div class="form-options">
                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms and Conditions</label>
                </div>
                <div class="remember-me-wrapper">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember Me</label>
                </div>
            </div>
            <p class="error-message" id="termsError" aria-live="polite"></p>
            <button type="submit" class="btn-login">Create Account</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
        <div class="signup-cta"><p>Already have an account? <a href="login.html">Log in</a></p></div>
<section class="get-app" id="getAppBlock" aria-label="Get the KITUI FARM app">
  <div class="get-app-icon"><img src="icons/icon-192x192.png" alt="" width="38" height="38"></div>
  <div class="get-app-body">
    <p class="get-app-title">Get the KITUI FARM app</p>
    <p class="get-app-desc">Tap download to install the app on your phone. It opens full-screen like a store app.</p>
  </div>
  <div class="get-app-actions"><button class="get-app-btn" id="getAppBtn" type="button">Download app</button></div>
  <p class="get-app-status" id="getAppStatus" hidden></p>
</section>
<script>
(function(){
  var btn=document.getElementById('getAppBtn');
  var status=document.getElementById('getAppStatus');
  var promptEvent=null;
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); promptEvent=e; },[]);
  window.addEventListener("appinstalled",function(){
    if(status){ status.hidden=false; status.textContent="KITUI FARM is installed. Open it from your home screen."; }
    if(btn){ btn.disabled=true; btn.textContent="Installed"; }
  });
  if(btn){
    btn.addEventListener("click",function(){
      if(promptEvent){
        promptEvent.prompt().then(function(choice){
          if(choice&&choice.outcome==="accepted"&&btn){ btn.textContent="Installing\u2026"; }
        }).catch(function(){});
        return;
      }
      if(status){
        status.hidden=false;
        status.textContent="In Chrome (Android) tap the menu \u22ee then Add to Home screen; in Safari (iPhone) tap Share then Add to Home Screen.";
      }
    });
  }
})();
</script>

    </main>
    <script>
        const signupForm = document.getElementById('signupForm');
        const signupEmail = document.getElementById('email');
        const signupPhone = document.getElementById('phone');
        const signupPassword = document.getElementById('password');
        const signupStatus = document.getElementById('formStatus');

        function setError(id, message) {
            const element = document.getElementById(id);
            element.textContent = message;
            element.classList.toggle('show', Boolean(message));
        }

        function normalizeKenyanPhone(value) {
            let digits = value.replace(/\D/g, '');
            if (digits.startsWith('254')) digits = digits.slice(3);
            if (digits.startsWith('0')) digits = digits.slice(1);
            return digits.slice(0, 9);
        }

        function isGmailAddress(value) {
            return /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@gmail\.com$/i.test(value.trim());
        }

        signupPhone.addEventListener('input', () => {
            signupPhone.value = normalizeKenyanPhone(signupPhone.value);
            setError('phoneError', '');
        });
        signupEmail.addEventListener('input', () => setError('emailError', ''));
        document.getElementById('name').addEventListener('input', () => setError('nameError', ''));
        document.getElementById('terms').addEventListener('change', () => setError('termsError', ''));

        signupPassword.addEventListener('input', () => {
            const strength = document.getElementById('passwordStrength');
            const value = signupPassword.value;
            const score = [value.length >= 8, /[A-Z]/.test(value), /[0-9]/.test(value), /[^A-Za-z0-9]/.test(value)]
                .filter(Boolean).length;
            strength.className = 'password-strength' + (score >= 4 ? ' strong' : score >= 2 ? ' medium' : score ? ' weak' : '');
            setError('passwordError', '');
        });

        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', () => {
                const visible = signupPassword.type === 'password';
                signupPassword.type = visible ? 'text' : 'password';
                button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
                button.setAttribute('aria-pressed', String(visible));
                button.querySelector('.eye-open').hidden = visible;
                button.querySelector('.eye-closed').hidden = !visible;
            });
        });

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            signupStatus.textContent = '';
            const name = document.getElementById('name').value.trim();
            const phone = normalizeKenyanPhone(signupPhone.value);
            const validPhone = /^[17]\d{8}$/.test(phone);
            const validEmail = isGmailAddress(signupEmail.value);
            const validPassword = signupPassword.value.length >= 8;
            const acceptedTerms = document.getElementById('terms').checked;

            setError('nameError', name ? '' : 'Please enter your full name.');
            setError('emailError', validEmail ? '' : 'Please enter a valid @gmail.com address.');
            setError('phoneError', validPhone ? '' : 'Enter 9 digits after +254, starting with 7 or 1.');
            setError('passwordError', validPassword ? '' : 'Password must be at least 8 characters.');
            setError('termsError', acceptedTerms ? '' : 'Please agree to the Terms and Conditions.');
            if (!name || !validEmail || !validPhone || !validPassword || !acceptedTerms) return;

            try {
                const email = signupEmail.value.trim().toLowerCase();
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        email,
                        phone: '+254' + phone,
                        role: document.querySelector('input[name="accountType"]:checked').value,
                        password: signupPassword.value,
                        remember: document.getElementById('remember').checked
                    })
                });
                if (!(response.headers.get('content-type') || '').includes('application/json')) {
                    throw new Error('Sign-up needs the Kitui Farm API server, which is not running on this hosted copy.');
                }
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Account creation failed. Please try again.');
                const user = result.user;
                if (result.token) {
                    try { localStorage.setItem('kituiFarmToken', result.token); } catch (error) { /* ignore */ }
                }
                const users = JSON.parse(localStorage.getItem('kituiFarmUsers') || '[]');
                if (!Array.isArray(users)) throw new Error('Saved account data is invalid.');
                localStorage.setItem('kituiFarmUsers', JSON.stringify([...users.filter(account => account.id !== user.id), user]));

                const session = JSON.stringify({
                    userId: user.id,
                    name: user.name,
                    email: user.email,
                    phone: user.phone,
                    role: user.role,
                    location: user.location || ''
                });
                const remember = document.getElementById('remember').checked;
                if (remember) {
                    localStorage.setItem('kituiFarmSession', session);
                    localStorage.setItem('kituiFarmRememberedLogin', email);
                } else {
                    sessionStorage.setItem('kituiFarmSession', session);
                    localStorage.removeItem('kituiFarmSession');
                    localStorage.removeItem('kituiFarmRememberedLogin');
                }
                window.location.href = user.role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html';
            } catch (error) {
                signupStatus.textContent = error.message || 'Account creation failed. Please try again.';
            }
        });
    </script>
</body>
</html>
