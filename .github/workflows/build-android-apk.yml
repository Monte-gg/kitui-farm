name: Build Signed KITUI FARM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APK_VERSION: "1.0.0"
      APK_NAME: "kitui-farm-android-v1.0.0.apk"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kitui-farm-release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            KEYSTORE_PASS="KituiFarmRelease2026!"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/kitui-farm-release.jks" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias kituifarm \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS" \
              -dname "CN=KITUI FARM, OU=Mobile, O=KITUI FARM, L=Kitui, ST=Kitui, C=KE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=kituifarm" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/kitui-farm-release.jks" >> $GITHUB_ENV

      - name: Build Signed Release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon

      - name: Verify Signed Release APK & Permissions
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          APK_SRC="android-app/app/build/outputs/apk/release/app-release.apk"
          cp "$APK_SRC" "$APK_NAME"

          echo "=== Verifying APK Signature ==="
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_NAME"

          echo "=== Inspecting APK Manifest & Permissions ==="
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK_NAME")
          echo "$BADGING" | grep -E "package:|application-label:|uses-permission:"

          if echo "$BADGING" | grep -q "POST_NOTIFICATIONS"; then
            echo "ERROR: POST_NOTIFICATIONS permission must not be present!"
            exit 1
          fi
          ls -lh "$APK_NAME"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitui-farm-android-v1.0.0
          path: ${{ env.APK_NAME }}

      - name: Publish Release APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APK_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "KITUI FARM Android App v${APK_VERSION}" \
              --notes "Signed standalone native Android WebView APK for KITUI FARM (com.kituifarm.app). No Chrome interface, no PWA/TWA wrapper, HTTPS only."
          fi
