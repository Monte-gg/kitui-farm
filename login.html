<!DOCTYPE html>
<html lang="en">
<head>
    <script src="api-base.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a8c3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="mask-icon" href="icons/icon.svg" color="#4a8c3f">
    <title>KITUI FARM - Log In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        h1 { text-align: center; color: #2d5a27; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #4a8c3f; }
        .password-row { position: relative; }
        .password-row input { padding-right: 48px; }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 42px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            line-height: 1;
            padding: 4px;
        }
        .toggle-password:hover { color: #4a8c3f; }
        .forgot-password { text-align: right; margin-top: 6px; font-size: 13px; }
        .forgot-password a, .signup-cta a {
            color: #4a8c3f;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-password a:hover, .signup-cta a:hover { text-decoration: underline; }
        .remember-me { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .remember-me input { width: 18px; height: 18px; accent-color: #4a8c3f; }
        .remember-me label { margin: 0; font-weight: 400; color: #555; }
        .error-message { color: #b42318; font-size: 12px; margin-top: 5px; display: none; }
        .error-message.show { display: block; }
        .form-status { margin-top: 16px; color: #2d5a27; font-size: 14px; text-align: center; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #4a8c3f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #3a7a2a; }
        .signup-cta { margin-top: 20px; text-align: center; color: #666; font-size: 14px; }
        @media (max-width: 480px) { .container { padding: 28px 22px; } }
    .get-app{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:22px 0 0;padding:16px 18px;border:1px solid #cfe3c6;border-radius:12px;background:#f2f9ee;}
.get-app-icon{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:#e3f0dc;display:grid;place-items:center;overflow:hidden;}
.get-app-icon img{width:38px;height:38px;display:block;}
.get-app-body{flex:1 1 220px;min-width:0;}
.get-app-title{margin:0 0 3px;color:#2d5a27;font-size:15px;font-weight:700;}
.get-app-desc{margin:0;color:#5c6a58;font-size:12px;line-height:1.45;}
.get-app-steps{margin:7px 0 0;color:#5c6a58;font-size:11.5px;line-height:1.55;}
.get-app-steps strong{color:#2d5a27;}
.get-app-actions{flex:0 0 auto;align-self:center;}
.get-app-btn{border:0;border-radius:9px;background:#4a8c3f;color:#fff;font-weight:650;font-size:13px;padding:10px 16px;cursor:pointer;white-space:nowrap;}
.get-app-btn:hover{background:#3a7a2a;}
.get-app-btn:disabled{opacity:.65;cursor:default;}
.get-app-status{flex-basis:100%;margin:0;color:#2d5a27;font-size:12px;}
:root[data-theme="dark"] .get-app{background:#263b27;border-color:#3d5a3b;}
:root[data-theme="dark"] .get-app-icon{background:#2f4a2f;}
:root[data-theme="dark"] .get-app-title{color:#d8e6cf;}
:root[data-theme="dark"] .get-app-desc,:root[data-theme="dark"] .get-app-steps{color:#a6b1a3;}
:root[data-theme="dark"] .get-app-steps strong,:root[data-theme="dark"] .get-app-status{color:#d8e6cf;}
</style>
</head>
<body>
    <main class="container">
        <h1>KITUI FARM</h1>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="identifier">Gmail address or Kenyan phone number</label>
                <input type="text" id="identifier" name="identifier" autocomplete="username"
                    placeholder="you@gmail.com or +254 712345678" required>
                <p class="error-message" id="identifierError" aria-live="polite"></p>
            </div>
            <div class="form-group password-row">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password"
                    placeholder="Enter your password" required>
                <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
                    <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
                        <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                        <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.1-.8"></path>
                    </svg>
                </button>
                <p class="error-message" id="passwordError" aria-live="polite"></p>
                <div class="forgot-password"><a href="forgot-password.html">Forgot Password?</a></div>
            </div>
            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember Me</label>
            </div>
            <button type="submit" class="btn-login">Log In</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
        <div class="signup-cta"><p>Don't have an account? <a href="signup.html">Sign up</a></p></div>
<section class="get-app" id="getAppBlock" aria-label="Get the KITUI FARM app">
  <div class="get-app-icon"><img src="icons/icon-192x192.png" alt="" width="38" height="38"></div>
  <div class="get-app-body">
    <p class="get-app-title">Get the KITUI FARM app</p>
    <p class="get-app-desc">Install the app on your phone. It opens full-screen like a store app.</p>
  </div>
  <div class="get-app-actions"><button class="get-app-btn" id="getAppBtn" type="button">Download app</button></div>
</section>
<script>
(function(){
  var btn=document.getElementById('getAppBtn');
  var block=document.getElementById('getAppBlock');
  var promptEvent=null;
  var waiters=[];
  function flush(event){
    promptEvent=event;
    var pending=waiters.splice(0);
    pending.forEach(function(fn){ fn(event); });
  }
  window.addEventListener("beforeinstallprompt",function(event){
    event.preventDefault();
    flush(event);
  },[]);
  window.addEventListener("appinstalled",function(){
    if(btn){ btn.disabled=true; btn.textContent="Installed"; }
  });
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  // Already installed as an app: no need to offer the download again.
  try {
    if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches&&block){ block.hidden=true; }
  } catch(error) { /* ignore */ }
  function run(event){
    btn.disabled=true;
    btn.textContent="Installing\u2026";
    event.prompt().then(function(choice){
      if(choice&&choice.outcome==="accepted"){ btn.textContent="Installed"; return; }
      btn.disabled=false; btn.textContent="Download app";
    }).catch(function(){
      btn.disabled=false; btn.textContent="Download app";
    });
  }
  if(btn){
    btn.addEventListener("click",function(){
      if(promptEvent){ run(promptEvent); return; }
      // Chrome hands over the prompt event a moment after load; wait for it.
      var settled=false;
      btn.disabled=true;
      btn.textContent="Preparing\u2026";
      waiters.push(function(event){
        if(settled){ return; }
        settled=true;
        btn.disabled=false;
        btn.textContent="Download app";
        run(event);
      });
      setTimeout(function(){
        if(settled){ return; }
        settled=true;
        btn.disabled=false;
        btn.textContent="Download app";
      },4000);
    });
  }
})();
</script>

    </main>
    <script>
        const loginForm = document.getElementById('loginForm');
        const identifierInput = document.getElementById('identifier');
        const passwordInput = document.getElementById('password');
        const rememberedLogin = localStorage.getItem('kituiFarmRememberedLogin');
        const rememberCheckbox = document.getElementById('remember');
        const formStatus = document.getElementById('formStatus');

        if (rememberedLogin) {
            rememberCheckbox.checked = true;
            identifierInput.value = rememberedLogin;
        }

        fetch('/api/health')
            .then(response => { if (!response.ok) throw new Error('API unavailable'); })
            .catch(() => {
                formStatus.textContent = 'Preview mode: the Kitui Farm API server is not running, so signing in is unavailable on this hosted copy.';
            });

        function setError(id, message) {
            const element = document.getElementById(id);
            element.textContent = message;
            element.classList.toggle('show', Boolean(message));
        }

        function normalizeKenyanPhone(value) {
            let digits = value.replace(/\D/g, '');
            if (digits.startsWith('254')) digits = digits.slice(3);
            if (digits.startsWith('0')) digits = digits.slice(1);
            return digits;
        }

        function isGmailAddress(value) {
            return /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@gmail\.com$/i.test(value.trim());
        }

        document.querySelector('.toggle-password').addEventListener('click', (event) => {
            const button = event.currentTarget;
            const visible = passwordInput.type === 'password';
            passwordInput.type = visible ? 'text' : 'password';
            button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
            button.setAttribute('aria-pressed', String(visible));
            button.querySelector('.eye-open').hidden = visible;
            button.querySelector('.eye-closed').hidden = !visible;
        });
        identifierInput.addEventListener('input', () => setError('identifierError', ''));
        passwordInput.addEventListener('input', () => setError('passwordError', ''));

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            formStatus.textContent = '';
            const value = identifierInput.value.trim();
            const isEmail = value.includes('@');
            const phoneDigits = normalizeKenyanPhone(value);
            const validPhone = /^[17]\d{8}$/.test(phoneDigits);
            const validIdentifier = isEmail ? isGmailAddress(value) : validPhone;
            const validPassword = passwordInput.value.length > 0;

            setError('identifierError', validIdentifier ? '' : isEmail
                ? 'Please enter a valid @gmail.com address.'
                : 'Enter a valid Kenyan number: 9 digits after +254, starting with 7 or 1.');
            setError('passwordError', validPassword ? '' : 'Please enter your password.');
            if (!validIdentifier || !validPassword) return;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: isEmail ? value.toLowerCase() : '+254' + phoneDigits,
                        password: passwordInput.value,
                        remember: rememberCheckbox.checked
                    })
                });
                if (!(response.headers.get('content-type') || '').includes('application/json')) {
                    throw new Error('Sign-in needs the Kitui Farm API server, which is not running on this hosted copy.');
                }
                const result = await response.json();
                if (!response.ok) {
                    setError('passwordError', result.error || 'Email/phone or password is incorrect.');
                    return;
                }
                const user = result.user;
                if (result.token) {
                    try { localStorage.setItem('kituiFarmToken', result.token); } catch (error) { /* ignore */ }
                }
                const users = JSON.parse(localStorage.getItem('kituiFarmUsers') || '[]');
                if (!Array.isArray(users)) throw new Error('Saved account data is invalid.');
                localStorage.setItem('kituiFarmUsers', JSON.stringify([...users.filter(account => account.id !== user.id), user]));

                const session = JSON.stringify({
                    userId: user.id,
                    name: user.name,
                    email: user.email,
                    phone: user.phone,
                    role: user.role,
                    location: user.location || ''
                });
                if (rememberCheckbox.checked) {
                    localStorage.setItem('kituiFarmSession', session);
                    localStorage.setItem('kituiFarmRememberedLogin', value);
                    sessionStorage.removeItem('kituiFarmSession');
                } else {
                    sessionStorage.setItem('kituiFarmSession', session);
                    localStorage.removeItem('kituiFarmSession');
                    localStorage.removeItem('kituiFarmRememberedLogin');
                }
                window.location.href = user.role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html';
            } catch (error) {
                formStatus.textContent = error.message || 'Sign-in failed. Please try again.';
            }
        });
    </script>
</body>
</html>
