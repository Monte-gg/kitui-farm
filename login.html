<!DOCTYPE html>
<html lang="en">
<head>
    <script src="api-base.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08723d">
    <title>KITUI FARM - Log In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        h1 { text-align: center; color: #17472c; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #08723d; }
        .password-input-wrap { position: relative; }
        .password-input-wrap input { padding-right: 58px; }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            background: transparent;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            color: #607060;
        }
        .toggle-password:hover { color: #17472c; background: #f0f5ed; }
        .toggle-password:focus-visible { outline: 2px solid #08723d; outline-offset: 1px; }
        .toggle-password svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .toggle-password .eye-off { display: none; }
        .toggle-password[aria-pressed="true"] .eye-on { display: none; }
        .toggle-password[aria-pressed="true"] .eye-off { display: block; }
        .toggle-password svg[hidden] { display: none !important; }
        .forgot-password { text-align: right; margin-top: 6px; font-size: 13px; }
        .forgot-password a, .signup-cta a {
            color: #08723d;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-password a:hover, .signup-cta a:hover { text-decoration: underline; }
        .remember-me { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .remember-me input { width: 18px; height: 18px; accent-color: #08723d; }
        .remember-me label { margin: 0; font-weight: 400; color: #555; }
        .error-message { color: #b42318; font-size: 12px; margin-top: 5px; display: none; }
        .error-message.show { display: block; }
        .form-status { margin-top: 16px; color: #17472c; font-size: 14px; text-align: center; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #08723d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #17472c; }
        .signup-cta { margin-top: 20px; text-align: center; color: #666; font-size: 14px; }
        @media (max-width: 480px) { .container { padding: 28px 22px; } }
</style>
    <script src="site-only.js" defer></script>
    <script defer src="update-notification.js?v=2"></script>
    <link rel="icon" type="image/png" href="assets/kitui-farm-emblem.png">
    <link rel="stylesheet" href="brand-theme.css?v=3" data-brand-theme>
    <script src="brand.js?v=3" defer></script>
</head>
<body>
    <main class="container">
        <h1>KITUI FARM</h1>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="identifier">Gmail address or Kenyan phone number</label>
                <input type="text" id="identifier" name="identifier" autocomplete="username"
                    placeholder="you@gmail.com or +254 712345678" required>
                <p class="error-message" id="identifierError" aria-live="polite"></p>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        placeholder="Enter your password" required>
                    <button class="toggle-password" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3 3.7M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                    </button>
                </div>
                <p class="error-message" id="passwordError" aria-live="polite"></p>
                <div class="forgot-password"><a href="forgot-password.html">Forgot Password?</a></div>
            </div>
            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember Me</label>
            </div>
            <button type="submit" class="btn-login">Log In</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
        <div class="signup-cta"><p>Don't have an account? <a href="signup.html">Sign up</a></p></div>
        <div class="signup-cta"><a href="about-us.html">About KITUI FARM</a></div>
        <div class="signup-cta"><a href="customer-service.html">Customer service · 0114 583 373</a></div>
        <div class="signup-cta"><a href="admin-signin.html">Admin access</a></div>


    </main>
    <script>
        const loginForm = document.getElementById('loginForm');
        const identifierInput = document.getElementById('identifier');
        const passwordInput = document.getElementById('password');
        const rememberedLogin = localStorage.getItem('kituiFarmRememberedLogin');
        const rememberCheckbox = document.getElementById('remember');
        const formStatus = document.getElementById('formStatus');

        const loginNotice = new URLSearchParams(window.location.search);
        if (loginNotice.get('accountDeleted') === '1') {
            formStatus.textContent = loginNotice.get('emailSent') === '1'
                ? 'Your account was permanently deleted. A confirmation email has been sent.'
                : 'Your account was permanently deleted, but the confirmation email could not be sent. Contact Customer Service at 0114 583 373 if you need help.';
        }

        if (rememberedLogin) {
            rememberCheckbox.checked = true;
            identifierInput.value = rememberedLogin;
        }

        fetch('/api/health')
            .then(response => { if (!response.ok) throw new Error('API unavailable'); })
            .catch(() => {
                formStatus.textContent = 'Preview mode: the Kitui Farm API server is not running, so signing in is unavailable on this hosted copy.';
            });

        function setError(id, message) {
            const element = document.getElementById(id);
            element.textContent = message;
            element.classList.toggle('show', Boolean(message));
        }

        function normalizeKenyanPhone(value) {
            let digits = value.replace(/\D/g, '');
            if (digits.startsWith('254')) digits = digits.slice(3);
            if (digits.startsWith('0')) digits = digits.slice(1);
            return digits;
        }

        function isGmailAddress(value) {
            return /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@gmail\.com$/i.test(value.trim());
        }

        document.querySelector('.toggle-password').addEventListener('click', (event) => {
            const button = event.currentTarget;
            const visible = passwordInput.type === 'password';
            passwordInput.type = visible ? 'text' : 'password';
            button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
            button.setAttribute('aria-pressed', String(visible));
        });
        identifierInput.addEventListener('input', () => setError('identifierError', ''));
        passwordInput.addEventListener('input', () => setError('passwordError', ''));

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            formStatus.textContent = '';
            const value = identifierInput.value.trim();
            const isEmail = value.includes('@');
            const phoneDigits = normalizeKenyanPhone(value);
            const validPhone = /^[17]\d{8}$/.test(phoneDigits);
            const validIdentifier = isEmail ? isGmailAddress(value) : validPhone;
            const validPassword = passwordInput.value.length > 0;

            setError('identifierError', validIdentifier ? '' : isEmail
                ? 'Please enter a valid @gmail.com address.'
                : 'Enter a valid Kenyan number: 9 digits after +254, starting with 7 or 1.');
            setError('passwordError', validPassword ? '' : 'Please enter your password.');
            if (!validIdentifier || !validPassword) return;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: isEmail ? value.toLowerCase() : '+254' + phoneDigits,
                        password: passwordInput.value,
                        remember: rememberCheckbox.checked
                    })
                });
                if (!(response.headers.get('content-type') || '').includes('application/json')) {
                    throw new Error('Sign-in needs the Kitui Farm API server, which is not running on this hosted copy.');
                }
                const result = await response.json();
                if (!response.ok) {
                    setError('passwordError', result.error || 'Email/phone or password is incorrect.');
                    return;
                }
                const user = result.user;
                if (result.token) {
                    try {
                        sessionStorage.setItem('kituiFarmToken', result.token);
                        if (rememberCheckbox.checked) localStorage.setItem('kituiFarmToken', result.token);
                    } catch (error) { /* ignore */ }
                }
                const users = JSON.parse(localStorage.getItem('kituiFarmUsers') || '[]');
                if (!Array.isArray(users)) throw new Error('Saved account data is invalid.');
                localStorage.setItem('kituiFarmUsers', JSON.stringify([...users.filter(account => account.id !== user.id), user]));

                const session = JSON.stringify({
                    userId: user.id,
                    name: user.name,
                    email: user.email,
                    phone: user.phone,
                    role: user.role,
                    location: user.location || ''
                });
                sessionStorage.setItem('kituiFarmSession', session);
                if (rememberCheckbox.checked) {
                    localStorage.setItem('kituiFarmSession', session);
                    localStorage.setItem('kituiFarmRememberedLogin', value);
                } else {
                    // Keep any remembered account untouched: other open tabs may use it.
                }
                const nextPage = new URLSearchParams(window.location.search).get('next');
                let safeProfileTarget = '';
                if (nextPage) {
                    try {
                        const target = new URL(nextPage, window.location.href);
                        const targetAccountId = target.searchParams.get('accountId');
                        if (target.origin === window.location.origin && target.pathname.endsWith('/profile.html')
                            && (!targetAccountId || targetAccountId === user.id)) safeProfileTarget = target.href;
                    } catch (error) { /* use the role dashboard for an invalid return URL */ }
                }
                window.location.href = safeProfileTarget || (nextPage === 'admin.html' ? 'admin.html' : (user.role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html'));
            } catch (error) {
                formStatus.textContent = error.message || 'Sign-in failed. Please try again.';
            }
        });
    </script>
</body>
</html>
