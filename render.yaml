# Render blueprint for the Kitui Farm API + static pages.
# Connect the GitHub repo in Render and it reads this file.
services:
  - type: web
    name: kitui-farm
    runtime: node
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
        - "*.html"
        - "**/*.html"
        - "**/*.js"
        - render.yaml
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Supabase -> Project Settings -> Database -> Connection string (URI)
      - key: DATABASE_URL
        sync: false
      # Gmail API sender account and OAuth credentials.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REFRESH_TOKEN
        sync: false
      - key: PUBLIC_APP_URL
        value: https://monte-gg.github.io/kitui-farm
      # Paystack webhook signing secret from Developers > API configuration.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      # Keep false until Paystack confirms Live Pesalink eligibility for this merchant.
      - key: PAYSTACK_BANK_ELIGIBLE
        sync: false
      # Retained only for reconciliation of older Paystack withdrawal requests.
      - key: PAYSTACK_TRANSFERS_ENABLED
        sync: false
      # Safaricom Daraja credentials. Use production-issued values for real payouts.
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_CALLBACK_BASE_URL
        value: https://kitui-farm.onrender.com
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      # Daraja Business-to-Customer payouts. Requires Safaricom B2C approval;
      # keep SecurityCredential private and use the encrypted credential supplied for the app.
      - key: MPESA_B2C_ENABLED
        value: "false"
      - key: MPESA_B2C_INITIATOR_NAME
        sync: false
      - key: MPESA_B2C_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_B2C_COMMAND_ID
        value: BusinessPayment
      - key: MPESA_B2C_PARTY_A
        sync: false
