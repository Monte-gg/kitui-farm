# Render blueprint for the Kitui Farm API + static pages.
# Connect the GitHub repo in Render and it reads this file.
services:
  - type: web
    name: kitui-farm
    runtime: node
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
        - "*.html"
        - "**/*.html"
        - "**/*.js"
        - render.yaml
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Supabase -> Project Settings -> Database -> Connection string (URI)
      - key: DATABASE_URL
        sync: false
      # Gmail API sender account and OAuth credentials.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REFRESH_TOKEN
        sync: false
      - key: PUBLIC_APP_URL
        value: https://monte-gg.github.io/kitui-farm
      # Paystack webhook signing secret from Developers > API configuration.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      # Keep false until Paystack confirms Live Pesalink eligibility for this merchant.
      - key: PAYSTACK_BANK_ELIGIBLE
        sync: false
      # Daraja STK credentials continue to serve deposits. B2C withdrawals use DARAJA_* below.
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_CALLBACK_BASE_URL
        value: https://kitui-farm.onrender.com
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      # B2C withdrawal callbacks use RENDER_EXTERNAL_URL and a separate callback token.
      # Keep sandbox until Safaricom approves B2C production access for this shortcode.
      - key: DARAJA_ENV
        value: sandbox
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_INITIATOR_NAME
        sync: false
      - key: DARAJA_SECURITY_CREDENTIAL
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_CALLBACK_SECRET
        sync: false
