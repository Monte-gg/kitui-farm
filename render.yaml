# Render blueprint for the Kitui Farm API + static pages.
# Connect the GitHub repo in Render and it reads this file.
services:
  - type: web
    name: kitui-farm
    runtime: node
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
        - "*.html"
        - "**/*.html"
        - "**/*.js"
        - render.yaml
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Supabase -> Project Settings -> Database -> Connection string (URI)
      - key: DATABASE_URL
        sync: false
      # Resend -> API Keys. Sender address must use a verified Resend domain.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PUBLIC_APP_URL
        value: https://kitui-farm.onrender.com
