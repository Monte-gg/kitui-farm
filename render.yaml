# Render blueprint for the Kitui Farm API + static pages.
# Connect the GitHub repo in Render and it reads this file.
services:
  - type: web
    name: kitui-farm
    runtime: node
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
        - "*.html"
        - "**/*.html"
        - "**/*.js"
        - render.yaml
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Supabase -> Project Settings -> Database -> Connection string (URI)
      - key: DATABASE_URL
        sync: false
      # Gmail API sender account and OAuth credentials.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REFRESH_TOKEN
        sync: false
      - key: PUBLIC_APP_URL
        value: https://monte-gg.github.io/kitui-farm
      # PayPal REST API credentials. Keep these private in the Render dashboard.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Set to live only after the PayPal business account is approved for Payouts.
      - key: PAYPAL_MODE
        sync: false
      # USD paid to a PayPal recipient for each 1 KES reserved from a wallet.
      # Update this rate before payouts when your chosen FX rate changes.
      - key: PAYPAL_KES_TO_USD_RATE
        sync: false
