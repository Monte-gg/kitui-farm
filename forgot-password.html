<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitui Farm Enterprise - Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        h1 { text-align: center; color: #2d5a27; margin-bottom: 15px; }
        .intro { text-align: center; color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 28px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #4a8c3f; }
        .error-message { color: #b42318; font-size: 12px; margin-top: 5px; display: none; }
        .error-message.show { display: block; }
        .form-status { margin-top: 16px; color: #2d5a27; font-size: 14px; text-align: center; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #4a8c3f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #3a7a2a; }
        .signup-cta { margin-top: 20px; text-align: center; color: #666; font-size: 14px; }
        .signup-cta a { color: #4a8c3f; text-decoration: none; font-weight: 600; }
        .signup-cta a:hover { text-decoration: underline; }
        @media (max-width: 480px) { .container { padding: 28px 22px; } }
    </style>
</head>
<body>
    <main class="container">
        <h1>Forgot Password?</h1>
        <p class="intro">Enter the Gmail address associated with your account and we’ll send you a reset link.</p>
        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="email">Gmail address</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@gmail.com" required>
                <p class="error-message" id="emailError" aria-live="polite"></p>
            </div>
            <button type="submit" class="btn-login">Send Reset Link</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
        <div class="signup-cta"><a href="login.html">Back to Log In</a></div>
    </main>
    <script>
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const formStatus = document.getElementById('formStatus');
        const gmailPattern = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@gmail\.com$/i;

        emailInput.addEventListener('input', () => {
            emailError.textContent = '';
            emailError.classList.remove('show');
            formStatus.textContent = '';
        });
        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!gmailPattern.test(emailInput.value.trim())) {
                emailError.textContent = 'Please enter a valid @gmail.com address.';
                emailError.classList.add('show');
                formStatus.textContent = '';
                return;
            }
            emailError.textContent = '';
            emailError.classList.remove('show');
            try {
                const response = await fetch('/api/auth/password-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value.trim() })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Could not request a password reset.');
                formStatus.textContent = 'If an account exists for that email, a reset link has been sent.';
            } catch (error) {
                formStatus.textContent = error.message || 'Could not request a password reset.';
            }
        });
    </script>
</body>
</html>
