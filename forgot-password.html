    <title>KITUI FARM - Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;

        }
        .container {
            background: white;

            box-shadow: 0 4px 24px rgba(0,0,0,0.1);

            max-width: 500px;

        .intro { text-align: center; color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 28px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;

        }

            color: white;
            border: none;
            border-radius: 8px;

            transition: background 0.2s;
        }

        .signup-cta a:hover { text-decoration: underline; }
        @media (max-width: 480px) { .container { padding: 28px 22px; } }
    .get-app{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:22px 0 0;padding:16px 18px;border:1px solid #cfe3c6;border-radius:12px;background:#f2f9ee;}
.get-app-icon{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:#e3f0dc;display:grid;place-items:center;overflow:hidden;}

.get-app-title{margin:0 0 3px;color:#2d5a27;font-size:15px;font-weight:700;}

.get-app-btn{border:0;border-radius:9px;background:#4a8c3f;color:#fff;font-weight:650;font-size:13px;padding:10px 16px;cursor:pointer;white-space:nowrap;}

<body>
    <main class="container">
        <h1>Forgot Password?</h1>
        <p class="intro">Enter the Gmail address associated with your account and we’ll send you a reset link.</p>
        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="email">Gmail address</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@gmail.com" required>
                <p class="error-message" id="emailError" aria-live="polite"></p>
            </div>
            <button type="submit" class="btn-login">Send Reset Link</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
        <div class="signup-cta"><a href="login.html">Back to Log In</a></div>
<section class="get-app" id="getAppBlock" aria-label="Get the KITUI FARM app">
  <div class="get-app-icon"><img src="icons/icon-192x192.png?v=2" alt="" width="38" height="38"></div>
  <div class="get-app-body">
    <p class="get-app-title">Get the KITUI FARM app</p>
    <p class="get-app-desc">Install the app on your phone. It opens full-screen like a store app.</p>
  </div>
  <div class="get-app-actions"><button class="get-app-btn" id="getAppBtn" type="button">Download app</button></div>
</section>
<script>
(function(){
  var btn=document.getElementById('getAppBtn');
  var block=document.getElementById('getAppBlock');
  var promptEvent=null;
  var waiters=[];
  function flush(event){
    promptEvent=event;
    var pending=waiters.splice(0);
    pending.forEach(function(fn){ fn(event); });
  }
  window.addEventListener("beforeinstallprompt",function(event){
    event.preventDefault();
    flush(event);
  },[]);
  window.addEventListener("appinstalled",function(){
    if(btn){ btn.disabled=true; btn.textContent="Installed"; }
  });
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  // Already installed as an app: no need to offer the download again.
  try {
    if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches&&block){ block.hidden=true; }
  } catch(error) { /* ignore */ }
  function run(event){
    btn.disabled=true;
    btn.textContent="Installing\u2026";
    event.prompt().then(function(choice){
      if(choice&&choice.outcome==="accepted"){ btn.textContent="Installed"; return; }
      btn.disabled=false; btn.textContent="Download app";
    }).catch(function(){
      btn.disabled=false; btn.textContent="Download app";
    });
  }
  if(btn){
    btn.addEventListener("click",function(){
      if(promptEvent){ run(promptEvent); return; }
      // Chrome hands over the prompt event a moment after load; wait for it.
      var settled=false;
      btn.disabled=true;
      btn.textContent="Preparing\u2026";
      waiters.push(function(event){
        if(settled){ return; }
        settled=true;
        btn.disabled=false;
        btn.textContent="Download app";
        run(event);
      });
      setTimeout(function(){
        if(settled){ return; }
        settled=true;
        btn.disabled=false;
        btn.textContent="Download app";
      },4000);
    });
  }
})();
</script>

    </main>
    <script>
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const formStatus = document.getElementById('formStatus');
        const gmailPattern = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@gmail\.com$/i;

        emailInput.addEventListener('input', () => {
            emailError.textContent = '';
            emailError.classList.remove('show');
            formStatus.textContent = '';
        });
        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!gmailPattern.test(emailInput.value.trim())) {
                emailError.textContent = 'Please enter a valid @gmail.com address.';
                emailError.classList.add('show');
                formStatus.textContent = '';
                return;
            }
            emailError.textContent = '';
            emailError.classList.remove('show');
            try {
                const response = await fetch('/api/auth/password-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value.trim() })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Could not request a password reset.');
                formStatus.textContent = 'If an account exists for that email, a reset link has been sent.';
            } catch (error) {
                formStatus.textContent = error.message || 'Could not request a password reset.';
            }
        });
    </script>
<script src="install.js" defer></script>
</body>
</html>
