<!DOCTYPE html>
<html lang="en">
<head>
    <script src="api-base.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a8c3f">
    <title>KITUI FARM - Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7f2; display: grid; place-items: center; min-height: 100vh; padding: 20px; color: #243326; }
        .container { background: #fff; border: 1px solid #e2e9de; border-radius: 18px; box-shadow: 0 10px 35px rgba(24, 56, 28, .08); padding: 38px; width: 100%; max-width: 480px; }
        .brand { text-align: center; color: #2d5a27; font-weight: 800; letter-spacing: .04em; margin-bottom: 25px; }
        h1 { text-align: center; color: #2d5a27; margin-bottom: 12px; font-size: clamp(1.8rem, 6vw, 2.25rem); }
        .intro { text-align: center; color: #667466; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 650; color: #26362a; font-size: 14px; }
        input { display: block; width: 100%; padding: 13px 14px; border: 1px solid #d7e1d4; border-radius: 9px; font-size: 16px; color: #243326; background: white; }
        .password-field { position: relative; }
        .password-field input { padding-right: 54px; }
        .toggle-password { position: absolute; top: 50%; right: 9px; transform: translateY(-50%); width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: #607060; cursor: pointer; }
        .toggle-password:hover { background: #f0f5ed; color: #2d5a27; }
        .toggle-password:focus-visible { outline: 2px solid #4a8c3f; outline-offset: 1px; }
        .toggle-password svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .toggle-password .eye-off { display: none; }
        .toggle-password[aria-pressed="true"] .eye-on { display: none; }
        .toggle-password[aria-pressed="true"] .eye-off { display: block; }
        input:focus { outline: 3px solid rgba(74, 140, 63, .16); border-color: #4a8c3f; }
        .hint { color: #718071; font-size: 13px; line-height: 1.45; margin-top: 7px; }
        .btn { display: block; width: 100%; padding: 14px; background: #4a8c3f; color: white; border: 0; border-radius: 9px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #3a7a2a; }
        .btn:disabled { opacity: .6; cursor: wait; }
        .link-button { display: block; margin: 14px auto 0; border: 0; background: none; color: #397b33; font: inherit; font-weight: 650; cursor: pointer; }
        .form-status { min-height: 22px; margin-top: 16px; color: #2d5a27; font-size: 14px; line-height: 1.5; text-align: center; }
        .form-status.error { color: #b42318; }
        .signup-cta { margin-top: 20px; text-align: center; color: #667466; font-size: 14px; }
        .signup-cta a { color: #397b33; text-decoration: none; font-weight: 650; }
        .signup-cta a:hover { text-decoration: underline; }
        [hidden] { display: none !important; }
        @media (max-width: 480px) { .container { padding: 29px 22px; } }
    </style>
    <script src="site-only.js" defer></script>
    <script defer src="update-notification.js"></script>
</head>
<body>
    <main class="container">
        <div class="brand">🌱 KITUI FARM</div>
        <h1>Reset your password</h1>
        <p class="intro">We’ll email you a one-time code. Enter it with a new password to get back into your account.</p>

        <form id="emailForm" novalidate>
            <div class="form-group">
                <label for="email">Gmail address</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@gmail.com" required>
                <p class="hint">Use the Gmail address on your KITUI FARM account.</p>
            </div>
            <button class="btn" id="sendCodeButton" type="submit">Send reset code</button>
        </form>

        <form id="resetForm" hidden novalidate>
            <div class="form-group">
                <label for="code">6-digit code</label>
                <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="Enter code" required>
                <p class="hint">The code expires after 10 minutes. Check your spam folder too.</p>
            </div>
            <div class="form-group">
                <label for="password">New password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="At least 8 characters" required>
                    <button class="toggle-password" type="button" aria-label="Show new password" aria-controls="password" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3 3.7M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <div class="password-field">
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Enter it again" required>
                    <button class="toggle-password" type="button" aria-label="Show confirmed password" aria-controls="confirmPassword" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3 3.7M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                    </button>
                </div>
            </div>
            <button class="btn" id="resetButton" type="submit">Save new password</button>
            <button class="link-button" id="resendButton" type="button">Send another code</button>
            <button class="link-button" id="changeEmailButton" type="button">Use a different email</button>
        </form>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        <div class="signup-cta"><a href="login.html">Back to Log In</a></div>
        <div class="signup-cta"><a href="customer-service.html">Customer service · 0114 583 373</a></div>
    </main>
    <script>
        const emailForm = document.getElementById('emailForm');
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const codeInput = document.getElementById('code');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const formStatus = document.getElementById('formStatus');
        const sendCodeButton = document.getElementById('sendCodeButton');
        const resetButton = document.getElementById('resetButton');
        const resendButton = document.getElementById('resendButton');
        const gmailPattern = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@gmail\.com$/i;
        let resendAvailableAt = 0;

        function setStatus(message, isError) {
            formStatus.textContent = message;
            formStatus.classList.toggle('error', Boolean(isError));
        }

        async function requestCode() {
            const email = emailInput.value.trim();
            if (!gmailPattern.test(email)) {
                setStatus('Enter the Gmail address on your KITUI FARM account.', true);
                emailInput.focus();
                return false;
            }
            sendCodeButton.disabled = true;
            resendButton.disabled = true;
            setStatus('Sending your code…', false);
            try {
                const response = await fetch('/api/auth/password-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || 'Could not request a reset code.');
                emailForm.hidden = true;
                resetForm.hidden = false;
                resendAvailableAt = Date.now() + 60000;
                setStatus(result.message || 'If an account exists for that email, a reset code has been sent.', false);
                codeInput.focus();
                return true;
            } catch (error) {
                setStatus(error.message || 'Could not request a reset code.', true);
                return false;
            } finally {
                sendCodeButton.disabled = false;
                resendButton.disabled = false;
            }
        }

        emailForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            await requestCode();
        });

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!/^\d{6}$/.test(codeInput.value.trim())) {
                setStatus('Enter the 6-digit code from your email.', true);
                codeInput.focus();
                return;
            }
            if (passwordInput.value.length < 8 || passwordInput.value.length > 128) {
                setStatus('Your new password must be 8 to 128 characters.', true);
                passwordInput.focus();
                return;
            }
            if (passwordInput.value !== confirmPasswordInput.value) {
                setStatus('The passwords do not match.', true);
                confirmPasswordInput.focus();
                return;
            }
            resetButton.disabled = true;
            setStatus('Updating your password…', false);
            try {
                const response = await fetch('/api/auth/password-reset/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value.trim(), code: codeInput.value.trim(), password: passwordInput.value })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || 'Could not reset your password.');
                resetForm.hidden = true;
                setStatus(result.message || 'Your password has been changed. You can now sign in with the new password.', false);
            } catch (error) {
                setStatus(error.message || 'Could not reset your password.', true);
            } finally {
                resetButton.disabled = false;
            }
        });

        resendButton.addEventListener('click', async () => {
            const secondsLeft = Math.ceil((resendAvailableAt - Date.now()) / 1000);
            if (secondsLeft > 0) {
                setStatus(`Please wait ${secondsLeft} seconds before requesting another code.`, true);
                return;
            }
            await requestCode();
        });

        document.getElementById('changeEmailButton').addEventListener('click', () => {
            resetForm.hidden = true;
            emailForm.hidden = false;
            setStatus('', false);
            emailInput.focus();
        });

        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.getAttribute('aria-controls'));
                const showing = input.type === 'password';
                input.type = showing ? 'text' : 'password';
                button.setAttribute('aria-pressed', String(showing));
                button.setAttribute('aria-label', `${showing ? 'Hide' : 'Show'} ${input.id === 'password' ? 'new password' : 'confirmed password'}`);
            });
        });
    </script>
</body>
</html>
