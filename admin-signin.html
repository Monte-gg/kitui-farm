<!doctype html>
<html lang="en">
<head>
    <script src="api-base.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4a8c3f">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin sign-in - KITUI FARM</title>
    <style>
        :root { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#263126; background:#f5f7f2; }
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; padding:22px; display:grid; place-items:center; }
        .card { width:min(100%,480px); padding:clamp(24px,6vw,40px); border:1px solid #e2e9de; border-radius:18px; background:#fff; box-shadow:0 12px 36px rgba(34,54,29,.08); }
        .brand { display:block; margin-bottom:26px; color:#2d5a27; text-align:center; font-size:22px; font-weight:850; text-decoration:none; }
        .eyebrow { margin:0 0 7px; color:#4a8c3f; text-align:center; font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
        h1 { margin:0; color:#2d5a27; text-align:center; font-size:clamp(27px,5vw,34px); }
        .intro { margin:10px 0 25px; color:#687366; text-align:center; line-height:1.55; }
        .field { margin:0 0 17px; }
        label { display:block; margin-bottom:7px; font-weight:700; }
        input { width:100%; min-height:48px; padding:11px 13px; border:1px solid #d8e1d4; border-radius:9px; background:white; color:#263126; font:inherit; }
        input:focus { outline:2px solid #d8ebd1; border-color:#4a8c3f; }
        .button { width:100%; min-height:48px; border:0; border-radius:9px; background:#4a8c3f; color:white; font:inherit; font-weight:750; cursor:pointer; }
        .button:disabled { opacity:.65; cursor:wait; }
        .status { min-height:24px; margin:14px 0 0; color:#2d5a27; text-align:center; font-size:14px; }
        .status.error { color:#b42318; }
        .back { display:block; margin-top:19px; color:#4a8c3f; text-align:center; font-weight:650; text-decoration:none; }
        .back:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <main class="card">
        <a class="brand" href="login.html">🌱 KITUI FARM</a>
        <p class="eyebrow">Restricted access</p>
        <h1>Admin sign-in</h1>
        <p class="intro">Enter your admin access code and account details. Access is granted only if the server has enabled your name and email for the admin console.</p>
        <form id="adminLoginForm">
            <div class="field"><label for="adminCode">Admin access code</label><input id="adminCode" name="code" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" placeholder="4-digit code" required></div>
            <div class="field"><label for="adminName">Full name</label><input id="adminName" name="name" autocomplete="name" maxlength="100" required></div>
            <div class="field"><label for="adminEmail">Admin email</label><input id="adminEmail" name="email" type="email" autocomplete="username" maxlength="254" required></div>
            <button class="button" id="adminLoginButton" type="submit">Continue to admin console</button>
            <p class="status" id="adminLoginStatus" role="status" aria-live="polite"></p>
        </form>
        <a class="back" href="login.html">← Back to user sign-in</a>
    </main>
    <script>
        const form = document.getElementById('adminLoginForm');
        const button = document.getElementById('adminLoginButton');
        const status = document.getElementById('adminLoginStatus');
        form.addEventListener('submit', async event => {
            event.preventDefault();
            button.disabled = true;
            status.classList.remove('error');
            status.textContent = 'Verifying admin access…';
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: document.getElementById('adminCode').value,
                        name: document.getElementById('adminName').value.trim(),
                        email: document.getElementById('adminEmail').value.trim().toLowerCase()
                    })
                });
                if (!(response.headers.get('content-type') || '').includes('application/json')) {
                    throw new Error('Admin sign-in is unavailable on this site copy. Open the KITUI FARM website and try again.');
                }
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Admin details could not be verified.');
                localStorage.setItem('kituiFarmToken', result.token);
                window.location.assign('admin.html');
            } catch (error) {
                status.textContent = error.message || 'Could not sign in. Please try again.';
                status.classList.add('error');
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
