<!doctype html>
<html lang="en">
<head>
    <script src="api-base.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="theme-init.js?v=1"></script>

    <meta name="theme-color" content="#08723d">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin sign-in - KITUI FARM</title>
    <style>
        :root { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#342718; background:#fbf8ed; }
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; padding:22px; display:grid; place-items:center; }
        .card { width:min(100%,480px); padding:clamp(24px,6vw,40px); border:1px solid #e2e9de; border-radius:18px; background:#fff; box-shadow:0 12px 36px rgba(34,54,29,.08); }
        .brand { display:block; margin-bottom:26px; color:#17472c; text-align:center; font-size:22px; font-weight:850; text-decoration:none; }
        .eyebrow { margin:0 0 7px; color:#08723d; text-align:center; font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
        h1 { margin:0; color:#17472c; text-align:center; font-size:clamp(27px,5vw,34px); }
        .intro { margin:10px 0 25px; color:#687366; text-align:center; line-height:1.55; }
        .field { margin:0 0 17px; }
        label { display:block; margin-bottom:7px; font-weight:700; }
        input { width:100%; min-height:48px; padding:11px 13px; border:1px solid #d8e1d4; border-radius:9px; background:white; color:#342718; font:inherit; }
        input:focus { outline:2px solid #d8ebd1; border-color:#08723d; }
        .password-wrap { position:relative; }
        .password-wrap input { padding-right:54px; }
        .toggle-password { position:absolute; top:50%; right:5px; display:grid; place-items:center; width:40px; height:40px; padding:0; transform:translateY(-50%); border:0; border-radius:8px; background:transparent; color:#687366; cursor:pointer; }
        .toggle-password:hover { background:#e5f0d8; color:#17472c; }
        .toggle-password svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .toggle-password .eye-off { display:none; }
        .toggle-password[aria-pressed="true"] .eye-on { display:none; }
        .toggle-password[aria-pressed="true"] .eye-off { display:block; }
        .button { width:100%; min-height:48px; border:0; border-radius:9px; background:#08723d; color:white; font:inherit; font-weight:750; cursor:pointer; }
        .button:disabled { opacity:.65; cursor:wait; }
        .status { min-height:24px; margin:14px 0 0; color:#17472c; text-align:center; font-size:14px; }
        .status.error { color:#b42318; }
        .back { display:block; margin-top:19px; color:#08723d; text-align:center; font-weight:650; text-decoration:none; }
        .back:hover { text-decoration:underline; }
        .back + .back { margin-top:12px; }
    </style>
    <script defer src="update-notification.js?v=2"></script>
    <link rel="icon" type="image/png" href="assets/kitui-farm-emblem.png">
    <link rel="stylesheet" href="brand-theme.css?v=4" data-brand-theme>
    <script src="brand.js?v=3" defer></script>
</head>
<body>
    <main class="card">
        <a class="brand" href="login.html">🌱 KITUI FARM</a>
        <p class="eyebrow">Restricted access</p>
        <h1>Admin sign-in</h1>
        <p class="intro">Sign in with the name, Gmail, and password you used to create your admin account.</p>
        <form id="adminLoginForm">
            <div class="field"><label for="adminName">Full name</label><input id="adminName" name="name" autocomplete="name" maxlength="100" required></div>
            <div class="field"><label for="adminEmail">Admin email</label><input id="adminEmail" name="email" type="email" autocomplete="username" maxlength="254" required></div>
            <div class="field"><label for="adminPassword">Password</label><div class="password-wrap"><input id="adminPassword" name="password" type="password" autocomplete="current-password" maxlength="128" required><button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false" aria-controls="adminPassword"><svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7s-3.6 7-10 7a10 10 0 0 1-4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button></div></div>
            <button class="button" id="adminLoginButton" type="submit">Continue to admin console</button>
            <p class="status" id="adminLoginStatus" role="status" aria-live="polite"></p>
        </form>
        <a class="back" href="login.html">← Back to user sign-in</a>
        <a class="back" href="admin-register.html">Create or enable an admin account</a>
    </main>
    <script>
        const form = document.getElementById('adminLoginForm');
        const button = document.getElementById('adminLoginButton');
        const status = document.getElementById('adminLoginStatus');
        if (new URLSearchParams(location.search).get('registered') === '1') {
            status.textContent = 'Admin account created. Sign in with your name, Gmail, and password.';
        }
        document.querySelector('.toggle-password').addEventListener('click', event => {
            const toggle = event.currentTarget;
            const input = document.getElementById('adminPassword');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            toggle.setAttribute('aria-pressed', String(show));
            toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
        form.addEventListener('submit', async event => {
            event.preventDefault();
            button.disabled = true;
            status.classList.remove('error');
            status.textContent = 'Verifying admin access…';
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('adminName').value.trim(),
                        email: document.getElementById('adminEmail').value.trim().toLowerCase(),
                        password: document.getElementById('adminPassword').value
                    })
                });
                if (!(response.headers.get('content-type') || '').includes('application/json')) {
                    throw new Error('Admin sign-in is unavailable on this site copy. Open the KITUI FARM website and try again.');
                }
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Admin details could not be verified.');
                sessionStorage.setItem('kituiFarmToken', result.token);
                localStorage.setItem('kituiFarmToken', result.token);
                const users = JSON.parse(localStorage.getItem('kituiFarmUsers') || '[]');
                if (!Array.isArray(users)) throw new Error('Saved account data is invalid.');
                localStorage.setItem('kituiFarmUsers', JSON.stringify([...users.filter(account => account.id !== result.user.id), result.user]));
                const session = JSON.stringify({
                    userId: result.user.id,
                    name: result.user.name,
                    email: result.user.email,
                    phone: result.user.phone,
                    role: result.user.role,
                    location: result.user.location || ''
                });
                sessionStorage.setItem('kituiFarmSession', session);
                localStorage.setItem('kituiFarmSession', session);
                window.location.assign('admin.html');
            } catch (error) {
                status.textContent = error.message || 'Could not sign in. Please try again.';
                status.classList.add('error');
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
