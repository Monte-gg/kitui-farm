<!doctype html>
<html lang="en">
<head>
    <script src="api-base.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="theme-init.js?v=1"></script>

    <meta name="theme-color" content="#08723d">
    <meta name="robots" content="noindex,nofollow">
    <title>Verify your email - KITUI FARM</title>
    <style>
        :root { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; --green:#08723d; --deep:#17472c; --ink:#342718; --muted:#687468; --line:#e5dcc6; }
        * { box-sizing:border-box; }
        body { display:grid; min-height:100vh; margin:0; padding:22px; place-items:center; background:#f4f7f2; color:var(--ink); }
        main { width:min(500px,100%); padding:34px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 12px 40px rgba(34,54,29,.08); text-align:center; }
        .mark { display:grid; width:58px; height:58px; margin:0 auto 17px; place-items:center; border-radius:16px; background:#e5f0d8; font-size:30px; }
        h1 { margin:0 0 10px; color:var(--deep); font-size:clamp(26px,6vw,34px); }
        p { color:var(--muted); line-height:1.6; }
        .status { min-height:25px; margin:17px 0; color:var(--deep); }
        .status.error { color:#b42318; }
        button,.link { display:inline-flex; min-height:46px; align-items:center; justify-content:center; margin:5px; padding:10px 18px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
        button.primary { border-color:var(--green); background:var(--green); color:#fff; }
        button:disabled { opacity:.65; cursor:wait; }
        [hidden] { display:none !important; }
        @media(max-width:480px) { main { padding:28px 20px; } }
    </style>
    <script defer src="update-notification.js?v=2"></script>
    <link rel="icon" type="image/png" href="assets/kitui-farm-emblem.png">
    <link rel="stylesheet" href="brand-theme.css?v=4" data-brand-theme>
    <script src="brand.js?v=3" defer></script>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">✉️</div>
        <h1 id="title">Check your Gmail</h1>
        <p id="description">We sent a secure verification link to the address you entered. Open it to finish creating your KITUI FARM account. Check your spam folder if it doesn’t appear.</p>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div>
            <button class="primary" id="confirmButton" type="button" hidden>Confirm email address</button>
            <a class="link" id="signupLink" href="signup.html">Back to sign up</a>
            <a class="link" href="login.html">Log in</a>
        </div>
    </main>
    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        const title = document.getElementById('title');
        const description = document.getElementById('description');
        const statusNode = document.getElementById('status');
        const button = document.getElementById('confirmButton');
        const signupLink = document.getElementById('signupLink');
        if (token) {
            button.hidden = false;
            signupLink.hidden = true;
            description.textContent = 'Confirm this Gmail address to activate your KITUI FARM account. The link can only be used once.';
        }
        function setStatus(message, isError = false) {
            statusNode.textContent = message;
            statusNode.classList.toggle('error', isError);
        }
        button.addEventListener('click', async () => {
            button.disabled = true;
            button.textContent = 'Verifying…';
            setStatus('Verifying your email address…');
            history.replaceState(null, '', location.pathname);
            try {
                const response = await fetch('/api/auth/verify-email', {
                    method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ token })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || 'Email verification failed.');
                const user = result.user;
                if (result.token) {
                    sessionStorage.setItem('kituiFarmToken', result.token);
                    if (result.remember) localStorage.setItem('kituiFarmToken', result.token);
                }
                const users = JSON.parse(localStorage.getItem('kituiFarmUsers') || '[]');
                localStorage.setItem('kituiFarmUsers', JSON.stringify([...users.filter(account => account.id !== user.id), user]));
                const session = JSON.stringify({ userId:user.id, name:user.name, email:user.email, phone:user.phone, role:user.role, location:user.location || '' });
                sessionStorage.setItem('kituiFarmSession', session);
                if (result.remember) {
                    localStorage.setItem('kituiFarmSession', session);
                    localStorage.setItem('kituiFarmRememberedLogin', user.email);
                }
                title.textContent = 'Email verified';
                description.textContent = 'Your KITUI FARM account is ready. Taking you to your dashboard…';
                button.hidden = true;
                setStatus('Account created successfully.');
                window.setTimeout(() => { location.replace(user.role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html'); }, 900);
            } catch (error) {
                setStatus(error.message || 'Email verification failed.', true);
                button.disabled = false;
                button.textContent = 'Try verification again';
            }
        });
    </script>
</body>
</html>
