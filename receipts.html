<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17472c">
    <title>My receipts - KITUI FARM</title>
    <link rel="icon" type="image/png" href="assets/kitui-farm-emblem.png">
    <link rel="stylesheet" href="brand-theme.css?v=5" data-brand-theme>
    <link rel="stylesheet" href="mobile-layout.css?v=2">
    <script src="api-base.js"></script>
    <script src="theme-init.js"></script>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:inherit}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(18px,calc((100% - 1040px)/2));border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--green-dark);font-weight:800;text-decoration:none}.brand img{width:40px;height:40px;object-fit:contain}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--green-dark);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.button.primary{border-color:var(--green);background:var(--green);color:#fff}main{width:min(960px,calc(100% - 32px));margin:34px auto 64px}.intro{margin-bottom:22px}.intro h1{margin:0;color:var(--green-dark);font-size:clamp(30px,5vw,42px)}.intro p,.muted{color:var(--muted)}#receiptList{display:grid;gap:12px}.receipt-card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.receipt-card h2{margin:0 0 5px;color:var(--green-dark);font-size:18px}.receipt-card p{margin:4px 0;color:var(--muted)}.receipt-actions{display:flex;flex-wrap:wrap;gap:8px}.notice{padding:15px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--muted)}[hidden]{display:none!important}@media(max-width:620px){.top{padding:10px 14px}.brand img{width:34px;height:34px}main{margin-top:24px}.receipt-card{align-items:flex-start;flex-direction:column}.receipt-actions{width:100%}.receipt-actions .button{flex:1}}
    </style>
</head>
<body>
    <header class="top"><a class="brand" href="buyer-dashboard.html#orders"><img src="assets/kitui-farm-emblem.png" alt="">KITUI FARM</a><a class="button" href="buyer-dashboard.html#orders">Back to my orders</a></header>
    <main>
        <section class="intro"><p class="eyebrow">Your account</p><h1>My receipts</h1><p>View, print, or save receipts for orders paid with your KITUI FARM Wallet.</p></section>
        <p class="notice" id="receiptListMessage" role="status" aria-live="polite">Loading your receipts…</p>
        <section id="receiptList" aria-label="Wallet payment receipts"></section>
    </main>
    <script>
        function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
        function money(value){return `KES ${Number(value).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}`}
        async function apiRequest(url){const response=await fetch(url);let data=null;try{data=await response.json()}catch{}if(!response.ok)throw new Error(data?.error||'Could not load your receipts.');return data}
        (async()=>{const message=document.getElementById('receiptListMessage'),list=document.getElementById('receiptList');try{const data=await apiRequest('/api/orders/purchases'),orders=(data.orders||[]).filter(order=>order.paymentMethod==='KITUI FARM Wallet');if(!orders.length){message.textContent='You do not have any wallet-paid orders yet. Receipts will appear here after a successful wallet payment.';return}message.hidden=true;list.innerHTML=orders.map(order=>{const date=order.createdAt?new Date(order.createdAt).toLocaleString('en-KE',{dateStyle:'medium',timeStyle:'short'}):'—',items=order.items.map(item=>item.name).join(', ');return `<article class="receipt-card"><div><h2>Receipt ${escapeHtml(order.id)}</h2><p>${escapeHtml(items)}</p><p>${escapeHtml(date)} · ${money(order.total)} · ${escapeHtml(order.status)}</p></div><div class="receipt-actions"><a class="button primary" href="receipt.html?id=${encodeURIComponent(order.id)}">View / print receipt</a></div></article>`}).join('')}catch(error){message.textContent=error.message||'Could not load your receipts.'}})();
    </script>
</body>
</html>
