<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17472c">
    <title>Order receipt - KITUI FARM</title>
    <link rel="icon" type="image/png" href="assets/kitui-farm-emblem.png">
    <link rel="stylesheet" href="brand-theme.css?v=5" data-brand-theme>
    <script src="api-base.js"></script>
    <script defer src="update-notification.js?v=4"></script>
    <script src="theme-init.js"></script>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:inherit}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(18px,calc((100% - 820px)/2));border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--green-dark);font-weight:800;text-decoration:none}.brand img{width:40px;height:40px;object-fit:contain}.actions{display:flex;gap:8px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--green-dark);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.button.primary{border-color:var(--green);background:var(--green);color:#fff}main{width:min(760px,calc(100% - 32px));margin:32px auto 60px}.paper{padding:clamp(20px,5vw,38px);border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 12px 34px #20351a0b}.paper-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}.paper-head img{width:62px;height:62px;object-fit:contain}.paper h1{margin:0;color:var(--green-dark);font-size:clamp(27px,5vw,36px)}.paper h2{margin:20px 0 6px;color:var(--green-dark)}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 18px;margin:20px 0}.meta p{margin:0;overflow-wrap:anywhere}.items{width:100%;border-collapse:collapse;text-align:left}.items th,.items td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}.items th{color:var(--muted);font-size:12px;text-transform:uppercase}.items td:nth-child(n+2),.items th:nth-child(n+2){text-align:right}.total{text-align:right;font-size:20px;color:var(--green-dark)}.status{margin-top:18px;padding:12px;border-radius:9px;background:var(--green-light);color:var(--green-dark)}.help{color:var(--muted);font-size:13px}.error{color:#b42318}@media(max-width:560px){.top{padding:10px 14px}.brand img{width:34px;height:34px}.actions .button{padding:8px 10px;font-size:13px}.meta{grid-template-columns:1fr}.items th,.items td{padding:9px 5px;font-size:13px}}@media print{body{background:#fff;color:#111}.top,.actions,.help{display:none!important}main{width:100%;margin:0}.paper{border:0;border-radius:0;box-shadow:none;padding:0}.status{background:#fff;color:#222;border:1px solid #aaa}}
    </style>
</head>
<body>
    <header class="top"><a class="brand" href="receipts.html"><img src="assets/kitui-farm-emblem.png" alt="">KITUI FARM</a><div class="actions"><a class="button" href="receipts.html">All receipts</a><button class="button primary" id="printReceipt" type="button" disabled>Print / save PDF</button></div></header>
    <main><p id="receiptMessage" class="help" role="status" aria-live="polite">Loading receipt…</p><article id="receiptPaper" class="paper" hidden></article></main>
    <script>
        function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
        function money(value){return `KES ${Number(value).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}`}
        async function apiRequest(url){const response=await fetch(url);let data=null;try{data=await response.json()}catch{}if(!response.ok)throw new Error(data?.error||'Could not load this receipt.');return data}
        (async()=>{const message=document.getElementById('receiptMessage'),paper=document.getElementById('receiptPaper'),button=document.getElementById('printReceipt');try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Choose a receipt from My receipts first.');const data=await apiRequest('/api/orders/purchases'),order=(data.orders||[]).find(item=>item.id===id);if(!order)throw new Error('This order is not available in your account.');if(order.paymentMethod!=='KITUI FARM Wallet')throw new Error('A payment receipt is available only for an order paid with your KITUI FARM Wallet.');const date=order.createdAt?new Date(order.createdAt).toLocaleString('en-KE',{dateStyle:'medium',timeStyle:'short'}):'—';paper.innerHTML=`<header class="paper-head"><div><p class="eyebrow">KITUI FARM · PURCHASE RECEIPT</p><h1>Payment receipt</h1></div><img src="assets/kitui-farm-emblem.png" alt="KITUI FARM logo"></header><div class="meta"><p><strong>Receipt / order ID:</strong><br>${escapeHtml(order.id)}</p><p><strong>Payment date:</strong><br>${escapeHtml(date)}</p><p><strong>Paid by:</strong><br>${escapeHtml(order.buyerName)}</p><p><strong>Payment method:</strong><br>KITUI FARM Wallet</p><p><strong>Delivery address:</strong><br>${escapeHtml(order.address)}</p><p><strong>Order status:</strong><br>${escapeHtml(order.status)}</p></div><h2>Items purchased</h2><table class="items"><thead><tr><th>Product</th><th>Quantity</th><th>Price / kg</th><th>Line total</th></tr></thead><tbody>${order.items.map(item=>`<tr><td>${escapeHtml(item.name)}<br><small>${escapeHtml(item.sellerName)}</small></td><td>${Number(item.quantity).toLocaleString('en-KE')} kg</td><td>${money(item.price)}</td><td>${money(Number(item.quantity)*Number(item.price))}</td></tr>`).join('')}</tbody></table><p class="total"><strong>Total paid: ${money(order.total)}</strong></p><p class="status">Payment received through KITUI FARM Wallet.</p><p class="help">Keep this receipt for your records. For help, contact KITUI FARM Customer Service at 0114 583 373.</p>`;paper.hidden=false;message.hidden=true;button.disabled=false;document.title=`Receipt ${order.id} - KITUI FARM`}catch(error){message.textContent=error.message||'Could not load this receipt.';message.classList.add('error')}})();
        document.getElementById('printReceipt').addEventListener('click',()=>window.print());
    </script>
</body>
</html>
