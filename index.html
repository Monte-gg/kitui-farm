<!DOCTYPE html>
<html lang="en">
<head>
    <script src="api-base.js?v=2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="theme-init.js?v=3"></script>

    <meta name="theme-color" content="#08723d">
    <title>KITUI FARM</title>
    <noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
    <style>
        body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#342718;}
    </style>
    <script>
        (function () {
            const isApp = /KituiFarmAndroidApp/i.test(navigator.userAgent || '') || Boolean(window.KituiAndroid);
            if (isApp) {
                try {
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('loggedOut') !== '1' && params.get('accountDeleted') !== '1') {
                        const rawSession = sessionStorage.getItem('kituiFarmSession') || localStorage.getItem('kituiFarmSession');
                        const token = sessionStorage.getItem('kituiFarmToken') || localStorage.getItem('kituiFarmToken');
                        if (rawSession && token) {
                            const session = JSON.parse(rawSession);
                            if (session && session.userId && session.role) {
                                sessionStorage.setItem('kituiFarmSession', rawSession);
                                sessionStorage.setItem('kituiFarmToken', token);
                                const dest = session.role === 'admin'
                                    ? 'admin.html'
                                    : (session.role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html');
                                window.location.replace(dest);
                                return;
                            }
                        }
                    }
                } catch (_) {}
            }
            window.location.replace('login.html');
        })();
    </script>
    <script src="site-only.js?v=2" defer></script>
    <script defer src="update-notification.js?v=5"></script>
    <link rel="icon" type="image/png" href="assets/kitui-farm-emblem.png">
    <link rel="stylesheet" href="brand-theme.css?v=4" data-brand-theme>
    <script src="brand.js?v=6" defer></script>
    <link rel="stylesheet" href="mobile-layout.css?v=2">
</head>
<body>
    <p>Continue to <a href="login.html">the Kitui Farm sign-in page</a>.</p>


</body>
</html>
